# Pull-only compose for Dokploy (see docker-compose.yml for local builds).
services:
  server:
    image: ${TUDU_SERVER_IMAGE}
    pull_policy: always
    expose:
      - "3456"
    environment:
      PORT: "3456"
      DATABASE_URL: ${DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      UPDATES_GITHUB_TOKEN: ${UPDATES_GITHUB_TOKEN}
      UPDATES_GITHUB_REPO: ${UPDATES_GITHUB_REPO}
      UPDATES_PUBLIC_BASE_URL: ${UPDATES_PUBLIC_BASE_URL}
      UPDATES_RELEASE_CHANNEL: ${UPDATES_RELEASE_CHANNEL}
      JIRA_TOKEN_ENCRYPTION_KEY: ${JIRA_TOKEN_ENCRYPTION_KEY}
      ATTACHMENT_STORAGE: ${ATTACHMENT_STORAGE}
      ATTACHMENT_FS_ROOT: ${ATTACHMENT_FS_ROOT}
      ATTACHMENT_MAX_BYTES: ${ATTACHMENT_MAX_BYTES}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      POSTHOG_API_KEY: ${POSTHOG_API_KEY}
      POSTHOG_HOST: ${POSTHOG_HOST}
      FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON}
    restart: unless-stopped

  web:
    image: ${TUDU_WEB_IMAGE}
    pull_policy: always
    expose:
      - "80"
    depends_on:
      - server
    restart: unless-stopped

  mcp:
    image: ${TUDU_MCP_IMAGE}
    pull_policy: always
    expose:
      - "3100"
    depends_on:
      - server
    environment:
      PORT: "3100"
      TUDU_API_URL: ${TUDU_API_URL:-http://server:3456}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL}
      TUDU_API_RESOURCE_URL: ${TUDU_API_RESOURCE_URL:-${BETTER_AUTH_URL}}
    restart: unless-stopped
