name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Lint copy
        run: pnpm lint:copy

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: Build macOS
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: macos-latest
    env:
      ZIP_NAME: Tudu-macOS-v${{ needs.release.outputs.new_release_version }}.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.new_release_version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        run: pnpm tauri:build

      - name: Package app zip
        run: |
          APP_PATH="apps/desktop/src-tauri/target/release/bundle/macos/Tudu.app"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "dist/$ZIP_NAME"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.release.outputs.new_release_version }}
          files: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            dist/${{ env.ZIP_NAME }}

  deploy-prod:
    name: Deploy Web + Server
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.new_release_version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Lint copy
        run: pnpm lint:copy

      - name: Build web and server
        run: pnpm build

      - name: Migrate prod database
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: pnpm db:migrate

      - name: Trigger Dokploy prod deployment
        uses: ./.github/actions/dokploy-deploy-compose
        with:
          api_url: ${{ secrets.DOKPLOY_API_URL }}
          api_key: ${{ secrets.DOKPLOY_API_KEY }}
          compose_id: ${{ secrets.DOKPLOY_COMPOSE_ID }}
          title: Release v${{ needs.release.outputs.new_release_version }}
          description: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  publish-release:
    name: Publish Release
    needs: [release, build-macos, deploy-prod]
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish release
        run: gh release edit "v${{ needs.release.outputs.new_release_version }}" --draft=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  rollback-release:
    name: Rollback Release
    needs: [release, build-macos, deploy-prod, publish-release]
    if: >-
      always() &&
      needs.release.outputs.new_release_published == 'true' &&
      (needs.build-macos.result == 'failure' ||
       needs.deploy-prod.result == 'failure' ||
       needs.publish-release.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete draft GitHub release
        run: gh release delete "v${{ needs.release.outputs.new_release_version }}" --yes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Delete remote tag
        run: git push origin ":refs/tags/v${{ needs.release.outputs.new_release_version }}"
        continue-on-error: true

      - name: Revert release commit on master
        run: |
          VERSION="${{ needs.release.outputs.new_release_version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git checkout master
          git pull origin master
          COMMIT=$(git log origin/master --grep="^chore(release): ${VERSION}$" -1 --format=%H)
          if [ -z "$COMMIT" ]; then
            echo "No release commit found for ${VERSION}, skipping revert."
            exit 1
          fi
          git revert "$COMMIT" --no-edit
          git push origin master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
