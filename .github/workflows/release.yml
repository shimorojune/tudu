name: 'Production: release'

# A release, by hand: the next version from the conventional commits (semantic-release: tag tudu-X, the changelog,
# a draft GitHub release), Tudu for macOS built against production and signed for the updater, its dmg, update bundle
# and signature on the release, the production images built on GitHub's arm64 runner, pushed to GHCR and deployed by
# Dokploy, then the release published (only then does the update feed offer it).
#
# Rehearsal (every pull request that touches the release path, or by hand with `rehearsal`): everything up to
# publishing and deploying. The version is worked out without tagging, the app is built and signed and kept as
# the run's artifacts, the images are built but not pushed.

on:
  workflow_dispatch:
    inputs:
      rehearsal:
        description: Rehearse only (no tag, no release, no deploy)
        type: boolean
        default: true
  pull_request:
    paths:
      - .github/workflows/release.yml
      - release.config.cjs
      - scripts/sync-version.mjs
      - apps/desktop/**
      - infra/production/**

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  PNPM_VERSION: 9.15.9
  REHEARSAL: ${{ github.event_name == 'pull_request' || inputs.rehearsal }}

jobs:
  version:
    name: Version and notes
    runs-on: ubuntu-latest
    # RELEASE_DEPLOY_KEY comes from Infisical, and only a job in `release` (master only) gets a token gha-release
    # accepts. PR rehearsals get `rehearsal`, which reaches nothing.
    environment: ${{ github.event_name == 'pull_request' && 'rehearsal' || 'release' }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    outputs:
      version: ${{ steps.v.outputs.version }}
      sha: ${{ steps.v.outputs.sha }}
    steps:
      # Over SSH with the release deploy key: the master ruleset requires CI passed, and only the deploy key may push
      # semantic-release's chore(release) commit past it (docs/release.md). Never on a pull request: the PR's own code
      # runs in this job (pnpm install, release.config.cjs), so rehearsals there check out with the token.
      - name: Secrets from Infisical (/release)
        if: github.event_name != 'pull_request'
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          domain: ${{ vars.INFISICAL_URL }}
          project-id: ${{ vars.INFISICAL_PROJECT }}
          env-slug: prod
          secret-path: /release
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
          ssh-key: ${{ github.event_name != 'pull_request' && env.RELEASE_DEPLOY_KEY || '' }}
          persist-credentials: true
      # The key now sits in the checkout's SSH config; pnpm install and semantic-release follow.
      - name: Forget the Infisical secrets
        if: github.event_name != 'pull_request'
        run: printf '%s=\n' RELEASE_DEPLOY_KEY >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: semantic-release
        id: v
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
        run: |
          set -o pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Without the last release's tag semantic-release starts again at 1.0.0 with every commit in the notes
          # (docs/release.md).
          if ! git tag -l 'tudu-*' | grep -q .; then
            echo "::error::No tudu-* tag on the repository; push the last release's tag first (docs/release.md)"
            exit 1
          fi
          if [ "$REHEARSAL" = "true" ]; then
            # A dry run on this branch: the version and the notes, nothing tagged or pushed. On a pull request the
            # checkout is the PR's merge ref, which semantic-release refuses to version; it is told it is the branch.
            GITHUB_EVENT_NAME=push GITHUB_REF="refs/heads/$BRANCH" GITHUB_SHA="$(git rev-parse HEAD)" \
              pnpm exec semantic-release --dry-run --no-ci --branches "$BRANCH" 2>&1 | tee release.log
          else
            pnpm exec semantic-release 2>&1 | tee release.log
          fi
          VERSION=$(grep -oE 'next release version is [0-9]+\.[0-9]+\.[0-9]+' release.log | tail -1 | awk '{print $5}' || true)
          if [ -z "$VERSION" ] && [ "$REHEARSAL" = "true" ]; then
            # Nothing releasable yet (only ci/docs/chore commits since the last tag): rehearse the build as the next
            # patch anyway, so a pull request that touches the release path is still checked.
            LAST=$(git tag -l 'tudu-*' --sort=-v:refname | grep -E '^tudu-[0-9]+\.[0-9]+\.[0-9]+$' | head -1 | sed 's/^tudu-//')
            VERSION=$(echo "$LAST" | awk -F. '{print $1"."$2"."$3+1}')
            echo "No releasable commits since tudu-$LAST; rehearsing as $VERSION."
          fi
          if [ -z "$VERSION" ]; then echo "No release: nothing to release since the last tag."; exit 1; fi
          if [ "$REHEARSAL" = "true" ]; then SHA=$(git rev-parse HEAD); else git fetch origin master && SHA=$(git rev-parse origin/master); fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "### Tudu $VERSION" >> "$GITHUB_STEP_SUMMARY"

  macos:
    name: Mac app
    needs: version
    runs-on: macos-latest
    # The real updater key comes from Infisical, only on real runs. A rehearsal signs with a key made in the job, so
    # no PR code ever runs next to the real one.
    environment: ${{ github.event_name == 'pull_request' && 'rehearsal' || 'release' }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Secrets from Infisical (/signing)
        if: env.REHEARSAL != 'true'
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          domain: ${{ vars.INFISICAL_URL }}
          project-id: ${{ vars.INFISICAL_PROJECT }}
          env-slug: prod
          secret-path: /signing
      - name: A throwaway updater key for the rehearsal
        if: env.REHEARSAL == 'true'
        working-directory: apps/desktop
        run: |
          pnpm exec tauri signer generate --ci -p '' -w "$RUNNER_TEMP/rehearsal.key"
          { echo 'TAURI_SIGNING_PRIVATE_KEY<<KEY'; cat "$RUNNER_TEMP/rehearsal.key"; echo; echo KEY; } >> "$GITHUB_ENV"
          echo 'TAURI_SIGNING_PRIVATE_KEY_PASSWORD=' >> "$GITHUB_ENV"
          echo "REHEARSAL_PUBKEY=$(tr -d '\n' < "$RUNNER_TEMP/rehearsal.key.pub")" >> "$GITHUB_ENV"
      - name: Build and sign
        run: node apps/desktop/scripts/desktop.mjs build --track production --version ${{ needs.version.outputs.version }} --out dist ${{ env.REHEARSAL == 'true' && '--pubkey "$REHEARSAL_PUBKEY"' || '' }}
      - name: Forget the Infisical secrets
        run: printf '%s=\n' TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD >> "$GITHUB_ENV"
      - name: The bundle is signed for the updater
        run: test -s "dist/Tudu.app.tar.gz.sig" && ls -la dist
      - name: The update signature matches the app's pubkey
        run: node scripts/verify-updater-sig.mjs dist/Tudu.app.tar.gz dist/Tudu.app.tar.gz.sig ${{ env.REHEARSAL == 'true' && '--pubkey "$REHEARSAL_PUBKEY"' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: tudu-${{ needs.version.outputs.version }}-macos
          path: |
            dist/*.dmg
            dist/Tudu.app.tar.gz
            dist/Tudu.app.tar.gz.sig
      - name: Attach to the draft release
        if: env.REHEARSAL != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "tudu-${{ needs.version.outputs.version }}" dist/*.dmg dist/Tudu.app.tar.gz dist/Tudu.app.tar.gz.sig --clobber

  # Built on GitHub's arm64 runner for the arm64 Dokploy host. A rehearsal only builds: no registry login, no push,
  # no secrets. A release pushes `production`, `sha-<sha>` and `v<version>` to GHCR.
  images:
    name: 'Image (${{ matrix.image }})'
    needs: version
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: tudu-api
            dockerfile: apps/server/Dockerfile
          - image: tudu-mcp
            dockerfile: apps/mcp/Dockerfile
          - image: tudu-web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.REHEARSAL != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: ${{ env.REHEARSAL != 'true' }}
          tags: |
            ghcr.io/shimorojune/${{ matrix.image }}:production
            ghcr.io/shimorojune/${{ matrix.image }}:sha-${{ needs.version.outputs.sha }}
            ghcr.io/shimorojune/${{ matrix.image }}:v${{ needs.version.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/shimorojune/tudu
          # Only the web image reads these; the others ignore them.
          build-args: |
            VITE_API_URL=https://api.tudu.ezdev.net
            VITE_TUDU_TRACK=production
            VITE_TUDU_VERSION=${{ needs.version.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.image }}-production
          cache-to: type=gha,scope=${{ matrix.image }}-production,mode=max

  production:
    name: 'Web + API: deploy'
    needs: [version, images]
    if: ${{ github.event_name != 'pull_request' && !inputs.rehearsal }}
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    # Playwright's own image for the smoke test, as the web end-to-end jobs; C01-U16 keeps its tag equal to the lockfile's.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - name: Secrets from Infisical (/dokploy)
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          domain: ${{ vars.INFISICAL_URL }}
          project-id: ${{ vars.INFISICAL_PROJECT }}
          env-slug: prod
          secret-path: /dokploy
      - name: Deploy through Dokploy
        run: node scripts/dokploy-deploy.mjs "$DOKPLOY_COMPOSE_ID" "release ${{ needs.version.outputs.version }}" infra/production/compose.yaml
      # pnpm install and the smoke test follow: third-party code must not see Dokploy's key.
      - name: Forget the Infisical secrets
        run: printf '%s=\n' DOKPLOY_URL DOKPLOY_API_KEY DOKPLOY_COMPOSE_ID >> "$GITHUB_ENV"
      # Web and API both, several passes in a row: Dokploy reports done while the containers are still swapping.
      - name: Wait until production is ready
        run: node scripts/wait-ready.mjs https://tudu.ezdev.net https://api.tudu.ezdev.net
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - run: pnpm install --frozen-lockfile
      - name: Smoke test production
        run: pnpm e2e smoke
        env:
          E2E_BASE_URL: https://tudu.ezdev.net
          E2E_API_URL: https://api.tudu.ezdev.net
          CI: 'true'

  publish:
    name: Publish the release
    needs: [version, macos, production]
    if: ${{ github.event_name != 'pull_request' && !inputs.rehearsal }}
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "tudu-${{ needs.version.outputs.version }}" --draft=false --latest
      - name: The feed offers it
        run: |
          for i in $(seq 1 20); do
            V=$(curl -fsS https://api.tudu.ezdev.net/updates/latest.json | jq -r .version || true)
            if [ "$V" = "${{ needs.version.outputs.version }}" ]; then echo "feed: $V"; exit 0; fi
            sleep 30
          done
          echo "the feed does not offer ${{ needs.version.outputs.version }} yet (cached five minutes, or no token)"; exit 1
