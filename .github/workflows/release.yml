name: Release

on:
  workflow_dispatch:
    inputs:
      release_as:
        description: "Force semver when auto version is blocked (e.g. 0.6.1)"
        required: false
        type: string
      finish_version:
        description: "Skip semantic-release; build and publish an existing draft tag (e.g. 0.6.1)"
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    outputs:
      new_release_published: ${{ steps.version.outputs.published }}
      new_release_version: ${{ steps.version.outputs.version }}
      finish_only: ${{ steps.version.outputs.finish_only }}
    steps:
      - name: Validate inputs
        run: |
          if [ -n "${{ inputs.release_as }}" ] && [ -n "${{ inputs.finish_version }}" ]; then
            echo "Use release_as OR finish_version, not both."
            exit 1
          fi

      - name: Finish existing release
        if: inputs.finish_version != ''
        id: finish
        run: |
          TAG="v${{ inputs.finish_version }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} not found. Create a draft release first."
            exit 1
          fi
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "version=${{ inputs.finish_version }}" >> "$GITHUB_OUTPUT"
          echo "finish_only=true" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Checkout
        if: inputs.finish_version == ''
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        if: inputs.finish_version == ''
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        if: inputs.finish_version == ''
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        if: inputs.finish_version == ''
        run: pnpm install --frozen-lockfile

      - name: Install ripgrep
        if: inputs.finish_version == ''
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Lint copy
        if: inputs.finish_version == ''
        run: pnpm lint:copy

      - name: Semantic Release
        if: inputs.finish_version == ''
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set +e
          LOG=semantic-release.log
          : > "$LOG"

          run_release() {
            local args=("$@")
            pnpm exec semantic-release "${args[@]}" 2>&1 | tee "$LOG"
            return ${PIPESTATUS[0]}
          }

          RELEASE_AS="${{ inputs.release_as }}"
          EC=0

          if [ -n "$RELEASE_AS" ]; then
            run_release --release-as "$RELEASE_AS"
            EC=$?
          else
            run_release
            EC=$?
            if [ "$EC" -ne 0 ] && grep -qE 'refs/tags/v0\.6\.0|tag v0\.6\.0' "$LOG"; then
              echo "v0.6.0 tag is blocked by repository rules. Retrying as 0.6.1."
              run_release --release-as 0.6.1
              EC=$?
            fi
          fi

          PUBLISHED=false
          VERSION=""
          if grep -q "Published release" "$LOG"; then
            PUBLISHED=true
            VERSION=$(grep -oE 'Published release [0-9]+\.[0-9]+\.[0-9]+' "$LOG" | tail -1 | awk '{print $3}')
          elif [ "$EC" -ne 0 ] && grep -q "The next release version is" "$LOG"; then
            VERSION=$(grep "The next release version is" "$LOG" | tail -1 | awk '{print $NF}')
            if grep -qE 'creations being restricted|push declined due to repository rule' "$LOG"; then
              echo "Tag push blocked for v${VERSION}. Creating tag via GitHub API."
              git fetch origin master
              SHA=$(git rev-parse origin/master)
              gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
                -f ref="refs/tags/v${VERSION}" \
                -f sha="$SHA" 2>/dev/null || true
              if ! gh release view "v${VERSION}" >/dev/null 2>&1; then
                gh release create "v${VERSION}" --target "$SHA" --draft --title "v${VERSION}" \
                  --notes "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/v0.5.2...v${VERSION}"
              fi
              PUBLISHED=true
              EC=0
            fi
          fi

          echo "published=${PUBLISHED}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "finish_only=false" >> "$GITHUB_OUTPUT"
          exit "$EC"

      - name: Set release outputs
        id: version
        run: |
          if [ -n "${{ inputs.finish_version }}" ]; then
            echo "published=${{ steps.finish.outputs.published }}" >> "$GITHUB_OUTPUT"
            echo "version=${{ steps.finish.outputs.version }}" >> "$GITHUB_OUTPUT"
            echo "finish_only=${{ steps.finish.outputs.finish_only }}" >> "$GITHUB_OUTPUT"
          else
            echo "published=${{ steps.semantic.outputs.published }}" >> "$GITHUB_OUTPUT"
            echo "version=${{ steps.semantic.outputs.version }}" >> "$GITHUB_OUTPUT"
            echo "finish_only=${{ steps.semantic.outputs.finish_only }}" >> "$GITHUB_OUTPUT"
          fi

  build-macos:
    name: Build macOS
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: macos-latest
    env:
      ZIP_NAME: Tudu-macOS-v${{ needs.release.outputs.new_release_version }}.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.new_release_version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri:build

      - name: Package app zip
        run: |
          APP_PATH="apps/desktop/src-tauri/target/release/bundle/macos/Tudu.app"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "dist/$ZIP_NAME"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.release.outputs.new_release_version }}
          files: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/macos/Tudu.app.tar.gz
            apps/desktop/src-tauri/target/release/bundle/macos/Tudu.app.tar.gz.sig
            dist/${{ env.ZIP_NAME }}

  deploy-prod:
    name: Deploy Web + Server
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.new_release_version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Lint copy
        run: pnpm lint:copy

      - name: Build web and server
        run: pnpm build

      - name: Migrate prod database
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: pnpm db:migrate

      - name: Trigger Dokploy prod deployment
        uses: ./.github/actions/dokploy-deploy-compose
        with:
          api_url: ${{ secrets.DOKPLOY_API_URL }}
          api_key: ${{ secrets.DOKPLOY_API_KEY }}
          compose_id: ${{ secrets.DOKPLOY_COMPOSE_ID }}
          title: Release v${{ needs.release.outputs.new_release_version }}
          description: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  publish-release:
    name: Publish Release
    needs: [release, build-macos, deploy-prod]
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        run: gh release edit "v${{ needs.release.outputs.new_release_version }}" --draft=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  rollback-release:
    name: Rollback Release
    needs: [release, build-macos, deploy-prod, publish-release]
    if: >-
      always() &&
      needs.release.outputs.new_release_published == 'true' &&
      needs.release.outputs.finish_only != 'true' &&
      (needs.build-macos.result == 'failure' ||
       needs.deploy-prod.result == 'failure' ||
       needs.publish-release.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete draft GitHub release
        run: gh release delete "v${{ needs.release.outputs.new_release_version }}" --yes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        continue-on-error: true

      - name: Delete remote tag
        run: git push origin ":refs/tags/v${{ needs.release.outputs.new_release_version }}"
        continue-on-error: true

      - name: Revert release commit on master
        run: |
          VERSION="${{ needs.release.outputs.new_release_version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git checkout master
          git pull origin master
          COMMIT=$(git log origin/master --grep="^chore(release): ${VERSION}$" -1 --format=%H)
          if [ -z "$COMMIT" ]; then
            echo "No release commit found for ${VERSION}, skipping revert."
            exit 1
          fi
          git revert "$COMMIT" --no-edit
          git push origin master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
