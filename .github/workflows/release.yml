name: Release

on:
  workflow_dispatch:
    inputs:
      track:
        description: "production (stable) or staging (prerelease + staging Dokploy)"
        required: true
        type: choice
        default: production
        options:
          - production
          - staging
      release_as:
        description: "Reserved for manual force version (not wired yet)"
        required: false
        type: string
      finish_version:
        description: "Skip semantic-release; build and publish an existing draft tag (e.g. 0.15.1 or 0.15.1-staging.1)"
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    outputs:
      new_release_published: ${{ steps.version.outputs.published }}
      new_release_version: ${{ steps.version.outputs.version }}
      release_sha: ${{ steps.version.outputs.release_sha }}
      finish_only: ${{ steps.version.outputs.finish_only }}
    steps:
      - name: Validate inputs
        run: |
          if [ -n "${{ inputs.release_as }}" ] && [ -n "${{ inputs.finish_version }}" ]; then
            echo "Use release_as OR finish_version, not both."
            exit 1
          fi

      - name: Finish existing release
        if: inputs.finish_version != ''
        id: finish
        run: |
          TAG="tudu-${{ inputs.finish_version }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} not found. Create a draft release first."
            exit 1
          fi
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "version=${{ inputs.finish_version }}" >> "$GITHUB_OUTPUT"
          echo "finish_only=true" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Checkout
        if: inputs.finish_version == ''
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        if: inputs.finish_version == ''
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        if: inputs.finish_version == ''
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        if: inputs.finish_version == ''
        run: pnpm install --frozen-lockfile

      - name: Install ripgrep
        if: inputs.finish_version == ''
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Lint copy
        if: inputs.finish_version == ''
        run: pnpm lint:copy

      - name: Semantic Release
        if: inputs.finish_version == ''
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -o pipefail
          LOG=semantic-release.log
          : > "$LOG"

          if [ "${{ github.event.inputs.track }}" = "staging" ]; then
            pnpm exec semantic-release --extends ./release.config.staging.cjs 2>&1 | tee "$LOG"
          else
            pnpm exec semantic-release 2>&1 | tee "$LOG"
          fi
          EC=${PIPESTATUS[0]}

          PUBLISHED=false
          VERSION=""
          RELEASE_SHA=""
          if grep -q "Published release" "$LOG"; then
            PUBLISHED=true
            VERSION=$(grep -oE 'Published release [0-9]+\.[0-9]+\.[0-9]+(-staging\.[0-9]+)?' "$LOG" | tail -1 | awk '{print $3}')
          fi

          if [ "$PUBLISHED" = "true" ] && [ -n "$VERSION" ]; then
            git fetch origin master
            RELEASE_SHA=$(git rev-parse origin/master)
            if ! git ls-remote --exit-code origin "refs/tags/tudu-${VERSION}" >/dev/null 2>&1; then
              echo "Tag tudu-${VERSION} is not on origin. Downstream jobs will checkout ${RELEASE_SHA}."
            fi
          fi

          echo "published=${PUBLISHED}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_sha=${RELEASE_SHA}" >> "$GITHUB_OUTPUT"
          echo "finish_only=false" >> "$GITHUB_OUTPUT"
          exit "$EC"

      - name: Set release outputs
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ -n "${{ inputs.finish_version }}" ]; then
            echo "published=${{ steps.finish.outputs.published }}" >> "$GITHUB_OUTPUT"
            echo "version=${{ steps.finish.outputs.version }}" >> "$GITHUB_OUTPUT"
            echo "finish_only=${{ steps.finish.outputs.finish_only }}" >> "$GITHUB_OUTPUT"
            RELEASE_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/tudu-${{ inputs.finish_version }}" --jq '.object.sha' 2>/dev/null || true)
            if [ -z "$RELEASE_SHA" ]; then
              RELEASE_SHA=$(gh release view "tudu-${{ inputs.finish_version }}" --json targetCommitish --jq '.targetCommitish' 2>/dev/null || true)
            fi
            echo "release_sha=${RELEASE_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "published=${{ steps.semantic.outputs.published }}" >> "$GITHUB_OUTPUT"
            echo "version=${{ steps.semantic.outputs.version }}" >> "$GITHUB_OUTPUT"
            echo "finish_only=${{ steps.semantic.outputs.finish_only }}" >> "$GITHUB_OUTPUT"
            echo "release_sha=${{ steps.semantic.outputs.release_sha }}" >> "$GITHUB_OUTPUT"
          fi

  build-macos:
    name: Build macOS
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: macos-latest
    env:
      ZIP_NAME: Tudu-macOS-v${{ needs.release.outputs.new_release_version }}.zip
      VITE_API_URL: ${{ github.event.inputs.track == 'staging' && 'https://api.staging.tudu.ezdev.net' || 'https://api.tudu.ezdev.net' }}
      VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
      VITE_POSTHOG_HOST: https://us.i.posthog.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.release_sha || format('tudu-{0}', needs.release.outputs.new_release_version) }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri:build

      - name: Package app zip
        run: |
          APP_PATH="apps/desktop/src-tauri/target/release/bundle/macos/Tudu.app"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "dist/$ZIP_NAME"

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="tudu-${{ needs.release.outputs.new_release_version }}"
          gh release upload "$TAG" \
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg \
            apps/desktop/src-tauri/target/release/bundle/macos/Tudu.app.tar.gz \
            apps/desktop/src-tauri/target/release/bundle/macos/Tudu.app.tar.gz.sig \
            "dist/${ZIP_NAME}" \
            --clobber

  deploy-prod:
    name: Deploy Web + Server
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.release_sha || format('tudu-{0}', needs.release.outputs.new_release_version) }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Lint copy
        run: pnpm lint:copy

      - name: Build web and server
        run: pnpm build

      - name: Migrate database
        env:
          DATABASE_URL: ${{ github.event.inputs.track == 'staging' && secrets.STAGING_DATABASE_URL || secrets.PROD_DATABASE_URL }}
        run: pnpm db:migrate

      - name: Trigger Dokploy deployment
        uses: ./.github/actions/dokploy-deploy-compose
        with:
          api_url: ${{ secrets.DOKPLOY_API_URL }}
          api_key: ${{ secrets.DOKPLOY_API_KEY }}
          compose_id: ${{ github.event.inputs.track == 'staging' && secrets.DOKPLOY_STAGING_COMPOSE_ID || secrets.DOKPLOY_COMPOSE_ID }}
          title: ${{ github.event.inputs.track == 'staging' && format('Staging release v{0}', needs.release.outputs.new_release_version) || format('Release v{0}', needs.release.outputs.new_release_version) }}
          description: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  publish-release:
    name: Publish Release
    needs: [release, build-macos, deploy-prod]
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        run: |
          TAG="tudu-${{ needs.release.outputs.new_release_version }}"
          if [ "${{ github.event.inputs.track }}" = "staging" ]; then
            gh release edit "$TAG" --draft=false --prerelease
          else
            gh release edit "$TAG" --draft=false
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  rollback-release:
    name: Rollback Release
    needs: [release, build-macos, deploy-prod, publish-release]
    if: >-
      always() &&
      needs.release.outputs.new_release_published == 'true' &&
      needs.release.outputs.finish_only != 'true' &&
      (needs.build-macos.result == 'failure' ||
       needs.deploy-prod.result == 'failure' ||
       needs.publish-release.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete draft GitHub release
        run: gh release delete "tudu-${{ needs.release.outputs.new_release_version }}" --yes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        continue-on-error: true

      - name: Delete remote tag
        run: git push origin ":refs/tags/tudu-${{ needs.release.outputs.new_release_version }}"
        continue-on-error: true

      - name: Revert release commit on master
        run: |
          VERSION="${{ needs.release.outputs.new_release_version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git checkout master
          git pull origin master
          COMMIT=$(git log origin/master --grep="^chore(release): ${VERSION}$" -1 --format=%H)
          if [ -z "$COMMIT" ]; then
            echo "No release commit found for ${VERSION}, skipping revert."
            exit 1
          fi
          git revert "$COMMIT" --no-edit
          git push origin master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
