name: Deploy staging

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build images on the host and deploy
    runs-on: [self-hosted, dokploy-deploy]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version
        id: v
        # The next patch after the latest release plus this commit (0.37.1-staging+3f9c2ab), for Settings' version line.
        run: |
          LAST=$(git tag -l 'tudu-*' --sort=-v:refname | grep -E '^tudu-[0-9]+\.[0-9]+\.[0-9]+$' | head -1 | sed 's/^tudu-//')
          VERSION=$(node -e "const [a,b,c]=process.argv[1].split('.').map(Number);console.log(a+'.'+b+'.'+(c+1)+'-staging+'+process.argv[2])" "$LAST" "${GITHUB_SHA::7}")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Staging web $VERSION" >> "$GITHUB_STEP_SUMMARY"
      - name: Build the API image
        run: docker build -f apps/server/Dockerfile -t tudu-api:staging -t tudu-api:${{ github.sha }} .
      - name: Build the web image
        run: docker build -f apps/web/Dockerfile --build-arg VITE_API_URL=https://api.staging.tudu.ezdev.net --build-arg VITE_TUDU_TRACK=staging --build-arg VITE_TUDU_VERSION=${{ steps.v.outputs.version }} -t tudu-web:staging -t tudu-web:${{ github.sha }} .
      - name: Deploy through Dokploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          COMPOSE_ID: ${{ secrets.DOKPLOY_STAGING_COMPOSE_ID }}
        run: node scripts/dokploy-deploy.mjs "$COMPOSE_ID" "staging ${{ github.sha }}" infra/staging/compose.yaml
      - name: Wait for the API
        run: |
          for i in $(seq 1 40); do
            if curl -fsS https://api.staging.tudu.ezdev.net/health >/dev/null; then echo up; exit 0; fi
            sleep 5
          done
          echo "api did not come up"; exit 1

  smoke:
    name: Smoke test staging
    needs: build-and-deploy
    runs-on: [self-hosted, dokploy-deploy]
    steps:
      - uses: actions/checkout@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm e2e smoke
        env:
          E2E_BASE_URL: https://staging.tudu.ezdev.net
          E2E_API_URL: https://api.staging.tudu.ezdev.net
          CI: 'true'
