name: 'Staging: deploy web + API'

# Every master push: the three images built for arm64 (the Dokploy host's architecture) on GitHub's own arm64 runner,
# pushed to GHCR as `staging` and `sha-<sha>`, then Dokploy redeploys infra/staging/compose.yaml, which pulls them.
# No job runs on our own hardware (docs/plans/hosted-deploy-runners.md).

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version
        id: v
        # The next patch after the latest release plus this commit (0.37.1-staging+3f9c2ab), for Settings' version line.
        run: |
          LAST=$(git tag -l 'tudu-*' --sort=-v:refname | grep -E '^tudu-[0-9]+\.[0-9]+\.[0-9]+$' | head -1 | sed 's/^tudu-//')
          VERSION=$(node -e "const [a,b,c]=process.argv[1].split('.').map(Number);console.log(a+'.'+b+'.'+(c+1)+'-staging+'+process.argv[2])" "$LAST" "${GITHUB_SHA::7}")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Staging web $VERSION" >> "$GITHUB_STEP_SUMMARY"

  images:
    name: Image (${{ matrix.image }})
    needs: version
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: tudu-api
            dockerfile: apps/server/Dockerfile
          - image: tudu-mcp
            dockerfile: apps/mcp/Dockerfile
          - image: tudu-web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/shimorojune/${{ matrix.image }}:staging
            ghcr.io/shimorojune/${{ matrix.image }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/shimorojune/tudu
          # Only the web image reads these; the others ignore them.
          build-args: |
            VITE_API_URL=https://api.staging.tudu.ezdev.net
            VITE_TUDU_TRACK=staging
            VITE_TUDU_VERSION=${{ needs.version.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.image }}-staging
          cache-to: type=gha,scope=${{ matrix.image }}-staging,mode=max

  deploy:
    name: Deploy
    needs: images
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy through Dokploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          COMPOSE_ID: ${{ secrets.DOKPLOY_STAGING_COMPOSE_ID }}
        run: node scripts/dokploy-deploy.mjs "$COMPOSE_ID" "staging ${{ github.sha }}" infra/staging/compose.yaml
      # The same readiness wait the release uses, so staging exercises production's path.
      - name: Wait until staging is ready
        run: node scripts/wait-ready.mjs https://staging.tudu.ezdev.net https://api.staging.tudu.ezdev.net

  smoke:
    name: Smoke test
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Playwright's own image, as the web end-to-end jobs; C01-U16 keeps its tag equal to the lockfile's.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm e2e smoke
        env:
          E2E_BASE_URL: https://staging.tudu.ezdev.net
          E2E_API_URL: https://api.staging.tudu.ezdev.net
          CI: 'true'
