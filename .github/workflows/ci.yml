name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - master
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: sudo apt-get update && sudo apt-get install -y ripgrep

      - run: pnpm lint:copy

      - run: pnpm typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test:coverage

  desktop-check:
    name: Desktop Rust check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install GTK/glib build deps
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev pkg-config

      - run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml

  e2e:
    name: Playwright E2E
    needs: [static, unit]
    runs-on: ubuntu-latest
    concurrency:
      group: e2e-db
      cancel-in-progress: false
    env:
      E2E_DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
      E2E_BETTER_AUTH_SECRET: ${{ secrets.E2E_BETTER_AUTH_SECRET }}
      NOTIFICATION_JOBS_ENABLED: "false"
      JIRA_TOKEN_ENCRYPTION_KEY: e2e-jira-encryption-key-32bytes!
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      - run: pnpm test:db

      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/e2e/test-results/
            apps/e2e/playwright-report/
