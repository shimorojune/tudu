name: 'Tests: PR + master'

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PNPM_VERSION: 9.15.9

jobs:
  # On a PR, run only the jobs its changes can affect; pushes to master and manual runs always run everything.
  # `CI passed` at the end is the one required check, so skipped jobs never leave a PR waiting.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    # Every job has a ceiling a few times its usual length, so a hung step (an apt mirror, a download) fails in minutes instead of GitHub's 6 hours.
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      unit: ${{ github.event_name != 'pull_request' || steps.code.outputs.code == 'true' }}
      web: ${{ github.event_name != 'pull_request' || steps.paths.outputs.web == 'true' }}
      api: ${{ github.event_name != 'pull_request' || steps.paths.outputs.api == 'true' }}
      mac: ${{ github.event_name != 'pull_request' || steps.paths.outputs.mac == 'true' }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
      # Anything but docs, infra and the other workflows is code.
      - id: code
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!infra/**'
              - '!.github/workflows/deploy-staging.yml'
              - '!.github/workflows/desktop-staging.yml'
              - '!.github/workflows/flake-check.yml'
              - '!.github/workflows/release.yml'
      # The Mac app loads the web app and talks to the API, so web, server and package changes run it too.
      - id: paths
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            shared: &shared
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.base.json'
              - '.npmrc'
              - '.github/workflows/ci.yml'
            packages: &packages
              - 'apps/web/**'
              - 'apps/server/**'
              - 'packages/core/**'
              - 'packages/ui/**'
              - 'packages/client/**'
              - 'packages/db/**'
            web:
              - *shared
              - *packages
              - 'packages/e2e/**'
              - 'scripts/e2e.mjs'
            api:
              - *shared
              - 'apps/server/**'
              - 'apps/mcp/**'
              - 'packages/core/**'
              - 'packages/db/**'
            mac:
              - *shared
              - *packages
              - 'apps/desktop/**'
              - 'packages/e2e/mac/**'
              - 'packages/e2e/scripts/**'
              - 'scripts/e2e-mac.mjs'

  static:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  # Unit and e2e run on GitHub-hosted runners, each with its own throwaway Postgres and RustFS service containers,
  # so test load stays off the Dokploy host. Tests create and drop their own databases on the server they are given.
  unit:
    name: Unit tests
    needs: changes
    if: needs.changes.outputs.unit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres: &postgres
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: tudu
          POSTGRES_PASSWORD: tudu
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tudu -d postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TUDU_CI_DATABASE_URL: postgres://tudu:tudu@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The close-matches model (cached)
        uses: actions/cache@v4
        with:
          path: .local/models
          key: embeddings-all-MiniLM-L6-v2-q8
      - run: EMBEDDINGS_MODEL_DIR=$PWD/.local/models pnpm --filter @tudu/server exec node --import tsx src/embeddings/fetch-model.ts
      - run: pnpm test -- --reporter=default --reporter=json --outputFile=reports/vitest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-report
          path: reports/vitest.json
          if-no-files-found: ignore

  e2e:
    name: Web end-to-end (${{ matrix.shard }}/4)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # Playwright's own image: browsers and their system libraries are in it, so no apt step (the Ubuntu mirror hung
    # this job for up to 45 minutes). The tag must equal @playwright/test in the lockfile; C01-U16 checks it.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    services:
      postgres: *postgres
      rustfs:
        image: rustfs/rustfs:latest
        env:
          RUSTFS_ACCESS_KEY: tudu-ci
          RUSTFS_SECRET_KEY: tudu-ci-secret
        ports: ['9000:9000']
    env:
      # Inside a container job the services are reached by name.
      TUDU_CI_DATABASE_URL: postgres://tudu:tudu@postgres:5432/postgres
      TUDU_CI_S3_ENDPOINT: http://rustfs:9000
      TUDU_CI_S3_BUCKET: tudu-ci
      TUDU_CI_S3_ACCESS_KEY_ID: tudu-ci
      TUDU_CI_S3_SECRET_ACCESS_KEY: tudu-ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The close-matches model (cached)
        uses: actions/cache@v4
        with:
          path: .local/models
          key: embeddings-all-MiniLM-L6-v2-q8
      - run: EMBEDDINGS_MODEL_DIR=$PWD/.local/models pnpm --filter @tudu/server exec node --import tsx src/embeddings/fetch-model.ts
      - name: Create the storage bucket
        run: pnpm --filter @tudu/server exec node --import tsx src/ensure-bucket.ts
        timeout-minutes: 2
      - run: pnpm e2e --shard=${{ matrix.shard }}/4
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            reports/playwright.json
            reports/playwright-html
          if-no-files-found: ignore

  # The API image builds and starts (chunk 13 bundles the close-matches model into it, on a Debian base): proved
  # here on a GitHub runner, since staging builds it on the Dokploy host only after a merge.
  api-image:
    name: API and MCP Docker images
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/server/Dockerfile -t tudu-api:ci .
      - name: The model is inside (no network) and the API answers
        run: |
          docker run --rm --network none tudu-api:ci node --import tsx src/embeddings/fetch-model.ts
          docker run -d --name api -p 3456:3456 -e NODE_ENV=development \
            -e DATABASE_URL=postgres://nobody@127.0.0.1:1/none -e AUTH_SECRET=ci-secret-ci-secret-ci-secret \
            --entrypoint sh tudu-api:ci -c "pnpm start"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3456/health; then exit 0; fi
            sleep 2
          done
          docker logs api
          exit 1
      # The MCP server's image (AI access) starts and answers its health check; it needs no database.
      - run: docker build -f apps/mcp/Dockerfile -t tudu-mcp:ci .
      - name: The MCP server answers
        run: |
          docker run -d --name mcp -p 3457:3457 tudu-mcp:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3457/health; then exit 0; fi
            sleep 2
          done
          docker logs mcp
          exit 1

  # The desktop group: Tudu Test, the real macOS app, built twice (this version and one up, signed with a key made
  # for the run) and driven over its control channel; plus the Rust unit tests. GitHub's macOS runner has no
  # service containers, so Postgres runs on the runner itself; attachments stay in memory.
  desktop:
    name: Mac app (macOS)
    needs: changes
    if: needs.changes.outputs.mac == 'true'
    runs-on: macos-latest
    # A cold Rust cache builds Tudu Test twice from scratch.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - uses: ankane/setup-postgres@v1
        with:
          postgres-version: 17
      - run: echo "TUDU_CI_DATABASE_URL=postgres://$(whoami)@127.0.0.1:5432/postgres" >> "$GITHUB_ENV"
      # pgvector for the runner's own Postgres (chunk 13): built against it, a minute.
      - name: pgvector
        run: |
          git clone --depth 1 --branch v0.8.7 https://github.com/pgvector/pgvector.git /tmp/pgvector
          make -C /tmp/pgvector -s
          make -C /tmp/pgvector -s install
      - run: pnpm install --frozen-lockfile
      - name: The close-matches model (cached)
        uses: actions/cache@v4
        with:
          path: .local/models
          key: embeddings-all-MiniLM-L6-v2-q8
      - run: EMBEDDINGS_MODEL_DIR=$PWD/.local/models pnpm --filter @tudu/server exec node --import tsx src/embeddings/fetch-model.ts

      - name: Rust unit tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --features control
      - name: The desktop group
        run: pnpm e2e:mac
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-report
          path: |
            reports/playwright-mac.json
            reports/playwright-mac-html
            reports/mac-results
          if-no-files-found: ignore

  # The one required check on master: red if any job failed or was cancelled, green when each passed or was skipped.
  passed:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [changes, static, unit, e2e, api-image, desktop]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Every job passed or was skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo '${{ toJSON(needs) }}'
          exit 1
      - run: echo "All good"
