name: 'Temporary: Infisical probe'

# Phase 0 of docs/plans/infisical-secrets.md: can GitHub-hosted runners reach infisical.rraj.dev, and does it speak
# OIDC machine-identity auth? Holds and reads no secrets. Removed before the real change merges.

on:
  pull_request:
    paths:
      - .github/workflows/infisical-probe.yml

permissions:
  contents: read

jobs:
  reach:
    name: Reach Infisical (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    env:
      URL: https://infisical.rraj.dev
    steps:
      - name: DNS and TLS
        run: |
          host=${URL#https://}
          (getent hosts "$host" || dscacheutil -q host -a name "$host") || true
          curl -sS -o /dev/null -m 20 -w 'ip %{remote_ip}, http %{http_code}, tls verify %{ssl_verify_result}, %{time_total}s\n' "$URL/"
      - name: Status endpoint
        run: |
          code=$(curl -sS -m 20 -o status.json -w '%{http_code}' "$URL/api/status")
          echo "HTTP $code"; head -c 1500 status.json; echo
          test "$code" = 200
          # Infisical will hold the app's signing key: nobody may sign themselves up. The status field is misnamed:
          # Infisical sets inviteOnlySignup = Boolean(allowSignUp), so false means sign-ups are off.
          grep -q '"inviteOnlySignup":false' status.json || { echo "::error::Sign-ups are open on infisical.rraj.dev"; exit 1; }
      - name: OIDC login route exists
        # A junk identity must be refused: 400/401/403, or the route's own 404 "OIDC auth method not found for
        # identity". A bare 404 (no such route) means this Infisical has no OIDC machine-identity auth.
        run: |
          code=$(curl -sS -m 20 -o oidc.json -w '%{http_code}' -X POST "$URL/api/v1/auth/oidc-auth/login" \
            -H 'content-type: application/json' -d '{"identityId":"00000000-0000-0000-0000-000000000000","jwt":"x"}')
          echo "HTTP $code"; head -c 800 oidc.json; echo
          case "$code" in 400|401|403|422) echo "OIDC route present" ;; 404) grep -q 'OIDC auth method not found' oidc.json && echo "OIDC route present" ;; *) exit 1 ;; esac

  oidc:
    name: OIDC login end to end
    # Phase 0b: a throwaway identity `gha-probe` bound to subject repo:shimorojune/tudu:pull_request, read-only on an
    # Infisical environment `probe` holding PROBE=ok. Skipped until the repository variable INFISICAL_PROBE_IDENTITY_ID
    # is set.
    if: ${{ vars.INFISICAL_PROBE_IDENTITY_ID != '' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      # The claims Infisical matches the identity against (not the token itself, which is a credential).
      - name: Token claims
        run: |
          jwt=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)
          echo "$jwt" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | jq '{sub, aud, iss, repository, repository_owner_id, environment, ref}' || true
      - uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_PROBE_IDENTITY_ID }}
          domain: https://infisical.rraj.dev
          project-id: ${{ vars.INFISICAL_PROJECT }}
          env-slug: probe
      - name: The value arrived and is masked
        run: |
          test "$PROBE" = ok
          echo "PROBE prints as: $PROBE"
