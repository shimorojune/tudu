name: 'Staging: build Mac app'

# Every merge to master: the Tudu Staging Mac app (the app against the staging API) built and signed for the updater, and put on
# the rolling `staging` pre-release. Its version is the next patch after the latest release plus this run's number
# (0.37.1-staging.132), so each build is newer than the last and older than the next release. Tudu Staging updates
# itself from it through the staging API's feed.

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: desktop-staging
  cancel-in-progress: false

permissions:
  contents: write

env:
  PNPM_VERSION: 9.15.9

jobs:
  build:
    name: Build, sign and publish
    runs-on: macos-latest
    # The updater key comes from Infisical through OIDC; `staging` (master only) is what gha-staging accepts.
    environment: staging
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Version
        id: v
        run: |
          LAST=$(git tag -l 'tudu-*' --sort=-v:refname | grep -E '^tudu-[0-9]+\.[0-9]+\.[0-9]+$' | head -1 | sed 's/^tudu-//')
          VERSION=$(node -e "const [a,b,c]=process.argv[1].split('.').map(Number);console.log(a+'.'+b+'.'+(c+1)+'-staging.'+process.argv[2])" "$LAST" "${{ github.run_number }}")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Tudu Staging $VERSION" >> "$GITHUB_STEP_SUMMARY"
      - name: Secrets from Infisical (/signing)
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          domain: ${{ vars.INFISICAL_URL }}
          project-id: ${{ vars.INFISICAL_PROJECT }}
          env-slug: staging
          secret-path: /signing
      - name: Build and sign
        run: node apps/desktop/scripts/desktop.mjs build --track staging --version ${{ steps.v.outputs.version }} --out dist
      - name: Forget the Infisical secrets
        run: printf '%s=\n' TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD >> "$GITHUB_ENV"
      - name: The update signature matches the app's pubkey
        run: node scripts/verify-updater-sig.mjs dist/Tudu.app.tar.gz dist/Tudu.app.tar.gz.sig
      - name: The rolling staging pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          git log -1 --format='%s%n%n%b' > notes.md
          gh release delete staging --yes --cleanup-tag || true
          gh release create staging --prerelease --target "$GITHUB_SHA" \
            --title "Tudu Staging ${{ steps.v.outputs.version }}" --notes-file notes.md \
            "dist/Tudu Staging.app.tar.gz" "dist/Tudu Staging.app.tar.gz.sig" dist/*.dmg
