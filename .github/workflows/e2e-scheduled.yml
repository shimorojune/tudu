name: E2E scheduled

on:
  schedule:
    # 9:00 and 18:00 IST (03:30 and 12:30 UTC)
    - cron: "30 3 * * *"
    - cron: "30 12 * * *"
  workflow_dispatch:

concurrency:
  group: e2e-scheduled
  cancel-in-progress: false

jobs:
  playwright-e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    env:
      E2E_DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
      E2E_BETTER_AUTH_SECRET: ${{ secrets.E2E_BETTER_AUTH_SECRET }}
      NOTIFICATION_JOBS_ENABLED: "false"
      JIRA_TOKEN_ENCRYPTION_KEY: e2e-jira-encryption-key-32bytes!
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      - run: pnpm test:db

      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/e2e/test-results/
            apps/e2e/playwright-report/
