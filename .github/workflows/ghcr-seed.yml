name: 'Seed GHCR images (temporary)'

# Throwaway for docs/plans/hosted-deploy-runners.md: creates the three GHCR packages (so they can be made public before
# staging pulls from them) and times arm64 builds on a hosted runner. Pushes only sha-<7> tags. Deleted before merge.
on:
  push:
    branches: [claude/project-thread-c5zjfp]
    paths: [.github/workflows/ghcr-seed.yml]

permissions:
  contents: read
  packages: write

jobs:
  seed:
    name: Build and push (${{ matrix.image }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: tudu-api
            dockerfile: apps/server/Dockerfile
          - image: tudu-mcp
            dockerfile: apps/mcp/Dockerfile
          - image: tudu-web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          tags: ghcr.io/shimorojune/${{ matrix.image }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/shimorojune/tudu
          build-args: |
            VITE_API_URL=https://api.staging.tudu.ezdev.net
            VITE_TUDU_TRACK=staging
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
