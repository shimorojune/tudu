name: Staging deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: staging-deploy
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  deploy-staging:
    name: Deploy staging (web + server)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    concurrency:
      group: dokploy-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: GHCR image owner
        id: ghcr
        shell: bash
        run: echo "owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Lint copy
        run: pnpm lint:copy

      - name: Migrate database
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: pnpm db:migrate

      - name: Build and push images
        id: images
        uses: ./.github/actions/build-push-images
        with:
          image_owner: ${{ steps.ghcr.outputs.owner }}
          image_tag: ${{ github.sha }}
          vite_api_url: https://api.staging.tudu.ezdev.net
          vite_posthog_key: ${{ secrets.VITE_POSTHOG_KEY }}
          vite_posthog_host: https://us.i.posthog.com
          vite_firebase_api_key: ${{ secrets.VITE_FIREBASE_API_KEY }}
          vite_firebase_auth_domain: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          vite_firebase_project_id: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          vite_firebase_messaging_sender_id: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          vite_firebase_app_id: ${{ secrets.VITE_FIREBASE_APP_ID }}
          vite_firebase_vapid_key: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}

      - name: Set Dokploy image env
        uses: ./.github/actions/dokploy-set-compose-env
        with:
          api_url: ${{ secrets.DOKPLOY_API_URL }}
          api_key: ${{ secrets.DOKPLOY_API_KEY }}
          compose_id: ${{ secrets.DOKPLOY_STAGING_COMPOSE_ID }}
          env_updates: |
            TUDU_WEB_IMAGE=${{ steps.images.outputs.web_image }}
            TUDU_SERVER_IMAGE=${{ steps.images.outputs.server_image }}

      - name: Trigger Dokploy deployment
        uses: ./.github/actions/dokploy-deploy-compose
        with:
          api_url: ${{ secrets.DOKPLOY_API_URL }}
          api_key: ${{ secrets.DOKPLOY_API_KEY }}
          compose_id: ${{ secrets.DOKPLOY_STAGING_COMPOSE_ID }}
          title: Staging deploy ${{ github.sha }}
          description: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          poll_timeout_minutes: "20"
