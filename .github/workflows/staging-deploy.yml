name: Staging deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: staging-deploy
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      skip_desktop: true
    secrets: inherit

  build-web:
    name: Build web image
    needs: ci
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: GHCR image owner
        id: ghcr
        shell: bash
        run: echo "owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: image
        uses: ./.github/actions/build-push-image
        with:
          image_owner: ${{ steps.ghcr.outputs.owner }}
          image_name: tudu-web
          image_tag: ${{ github.sha }}
          dockerfile: apps/web/Dockerfile
          cache_scope: tudu-web
          vite_api_url: https://api.staging.tudu.ezdev.net
          vite_posthog_key: ${{ secrets.VITE_POSTHOG_KEY }}
          vite_posthog_host: https://us.i.posthog.com
          vite_firebase_api_key: ${{ secrets.VITE_FIREBASE_API_KEY }}
          vite_firebase_auth_domain: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          vite_firebase_project_id: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          vite_firebase_messaging_sender_id: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          vite_firebase_app_id: ${{ secrets.VITE_FIREBASE_APP_ID }}
          vite_firebase_vapid_key: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}

  build-server:
    name: Build server image
    needs: ci
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: GHCR image owner
        id: ghcr
        shell: bash
        run: echo "owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: image
        uses: ./.github/actions/build-push-image
        with:
          image_owner: ${{ steps.ghcr.outputs.owner }}
          image_name: tudu-server
          image_tag: ${{ github.sha }}
          dockerfile: apps/server/Dockerfile
          cache_scope: tudu-server

  deploy-staging:
    name: Deploy staging (web + server)
    needs: [build-web, build-server]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    concurrency:
      group: dokploy-deploy-staging
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrate database
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: pnpm db:migrate

      - name: Set Dokploy image env
        uses: ./.github/actions/dokploy-set-compose-env
        with:
          api_url: ${{ secrets.DOKPLOY_API_URL }}
          api_key: ${{ secrets.DOKPLOY_API_KEY }}
          compose_id: ${{ secrets.DOKPLOY_STAGING_COMPOSE_ID }}
          env_updates: |
            TUDU_WEB_IMAGE=${{ needs.build-web.outputs.image }}
            TUDU_SERVER_IMAGE=${{ needs.build-server.outputs.image }}

      - name: Trigger Dokploy deployment
        uses: ./.github/actions/dokploy-deploy-compose
        with:
          api_url: ${{ secrets.DOKPLOY_API_URL }}
          api_key: ${{ secrets.DOKPLOY_API_KEY }}
          compose_id: ${{ secrets.DOKPLOY_STAGING_COMPOSE_ID }}
          title: Staging deploy ${{ github.sha }}
          description: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          poll_timeout_minutes: "20"
