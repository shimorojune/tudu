name: Dokploy set compose environment
description: Merge keys into a Dokploy compose .env and save via compose.saveEnvironment

inputs:
  api_url:
    description: Dokploy base URL
    required: true
  api_key:
    description: Dokploy API key
    required: true
  compose_id:
    description: Dokploy compose ID
    required: true
  env_updates:
    description: Newline-separated KEY=value lines to merge into existing compose env
    required: true

runs:
  using: composite
  steps:
    - name: Merge and save compose environment
      shell: bash
      env:
        DOKPLOY_API_URL: ${{ inputs.api_url }}
        DOKPLOY_API_KEY: ${{ inputs.api_key }}
        DOKPLOY_COMPOSE_ID: ${{ inputs.compose_id }}
        ENV_UPDATES: ${{ inputs.env_updates }}
      run: |
        set -euo pipefail
        api_url="${DOKPLOY_API_URL%/}"

        one_response=$(curl -fsS --connect-timeout 30 --max-time 120 \
          -G "${api_url}/api/compose.one" \
          --data-urlencode "composeId=${DOKPLOY_COMPOSE_ID}" \
          -H "x-api-key: ${DOKPLOY_API_KEY}")

        current_env=$(echo "$one_response" | jq -r '
          if type == "object" then
            if (.env | type) == "string" then .env
            elif (.data.env | type) == "string" then .data.env
            else "" end
          else "" end
        ')

        declare -A env_map=()
        while IFS= read -r line || [ -n "$line" ]; do
          trimmed="${line#"${line%%[![:space:]]*}"}"
          trimmed="${trimmed%"${trimmed##*[![:space:]]}"}"
          [ -z "$trimmed" ] && continue
          [[ "$trimmed" == \#* ]] && continue
          key="${trimmed%%=*}"
          value="${trimmed#*=}"
          [ -z "$key" ] && continue
          env_map["$key"]="$value"
        done <<< "$current_env"

        while IFS= read -r line || [ -n "$line" ]; do
          trimmed="${line#"${line%%[![:space:]]*}"}"
          trimmed="${trimmed%"${trimmed##*[![:space:]]}"}"
          [ -z "$trimmed" ] && continue
          [[ "$trimmed" == \#* ]] && continue
          key="${trimmed%%=*}"
          value="${trimmed#*=}"
          [ -z "$key" ] && continue
          env_map["$key"]="$value"
        done <<< "$ENV_UPDATES"

        merged_env=""
        for key in $(printf '%s\n' "${!env_map[@]}" | sort); do
          merged_env+="${key}=${env_map[$key]}"$'\n'
        done
        merged_env="${merged_env%$'\n'}"

        payload=$(jq -n \
          --arg composeId "$DOKPLOY_COMPOSE_ID" \
          --arg env "$merged_env" \
          '{composeId: $composeId, env: $env, createEnvFile: true}')

        curl -fsS --connect-timeout 30 --max-time 120 \
          -X POST "${api_url}/api/compose.saveEnvironment" \
          -H "Content-Type: application/json" \
          -H "x-api-key: ${DOKPLOY_API_KEY}" \
          -d "$payload"

        echo "Dokploy compose environment updated."
