name: Dokploy deploy compose
description: Trigger a Dokploy compose.deploy for a compose ID

inputs:
  api_url:
    description: Dokploy base URL
    required: true
  api_key:
    description: Dokploy API key
    required: true
  compose_id:
    description: Dokploy compose ID
    required: true
  title:
    description: Deployment title
    required: true
  description:
    description: Deployment description
    required: false
    default: ""
  wait_for_completion:
    description: Poll deployment status until done or error
    required: false
    default: "true"
  poll_interval_seconds:
    description: Seconds between deployment status polls
    required: false
    default: "20"
  poll_timeout_minutes:
    description: Maximum minutes to wait for deployment completion
    required: false
    default: "45"

runs:
  using: composite
  steps:
    - name: Trigger Dokploy deployment
      shell: bash
      env:
        DOKPLOY_API_URL: ${{ inputs.api_url }}
        DOKPLOY_API_KEY: ${{ inputs.api_key }}
        DOKPLOY_COMPOSE_ID: ${{ inputs.compose_id }}
        DEPLOY_TITLE: ${{ inputs.title }}
        DEPLOY_DESCRIPTION: ${{ inputs.description }}
        WAIT_FOR_COMPLETION: ${{ inputs.wait_for_completion }}
        POLL_INTERVAL_SECONDS: ${{ inputs.poll_interval_seconds }}
        POLL_TIMEOUT_MINUTES: ${{ inputs.poll_timeout_minutes }}
      run: |
        set -euo pipefail
        api_url="${DOKPLOY_API_URL%/}"
        payload=$(jq -n \
          --arg composeId "$DOKPLOY_COMPOSE_ID" \
          --arg title "$DEPLOY_TITLE" \
          --arg description "$DEPLOY_DESCRIPTION" \
          '{composeId: $composeId, title: $title, description: $description}')

        trigger_deployment() {
          local attempt=1
          local max_attempts=5
          while [ "$attempt" -le "$max_attempts" ]; do
            echo "Triggering Dokploy deployment (attempt ${attempt}/${max_attempts})..."
            if curl -fsS --retry 0 --connect-timeout 30 --max-time 120 \
              -X POST "${api_url}/api/compose.deploy" \
              -H "Content-Type: application/json" \
              -H "x-api-key: ${DOKPLOY_API_KEY}" \
              -d "$payload"; then
              echo "Deployment triggered successfully."
              return 0
            fi

            local exit_code=$?
            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "Dokploy deploy trigger failed after ${max_attempts} attempts (exit ${exit_code})."
              return "$exit_code"
            fi

            local sleep_seconds=$((attempt * 15))
            echo "Dokploy API unavailable (exit ${exit_code}). Retrying in ${sleep_seconds}s..."
            sleep "$sleep_seconds"
            attempt=$((attempt + 1))
          done
        }

        fetch_deployments() {
          curl -fsS --retry 0 --connect-timeout 30 --max-time 120 \
            -G "${api_url}/api/deployment.allByCompose" \
            --data-urlencode "composeId=${DOKPLOY_COMPOSE_ID}" \
            -H "x-api-key: ${DOKPLOY_API_KEY}"
        }

        normalize_deployments() {
          jq -c '
            if type == "array" then .
            elif (.data | type) == "array" then .data
            elif (.result | type) == "array" then .result
            elif (.data.data | type) == "array" then .data.data
            else [] end
          '
        }

        find_deployment() {
          local response="$1"
          local before_ids="$2"
          local title="$3"
          local description="$4"
          local since="$5"
          local version run_id

          version=$(echo "$title" | sed -n 's/^Release v//p')
          run_id=$(echo "$description" | sed -n 's|.*/actions/runs/||p')

          echo "$response" | normalize_deployments | jq -c \
            --arg before_ids "$before_ids" \
            --arg title "$title" \
            --arg description "$description" \
            --arg version "$version" \
            --arg run_id "$run_id" \
            --argjson since "$since" '
            ($before_ids | split("\n") | map(select(length > 0))) as $known |
            [.[] |
              (.deploymentId // .id // empty) as $id |
              select($id != "") |
              ([$known[] | select(. == $id)] | length == 0) as $is_new |
              (.createdAt | if type == "number" then
                (if . > 9999999999 then (. / 1000 | floor) else . end)
              elif type == "string" then
                ((. | sub("\\.[0-9]+Z$"; "Z")) | fromdateiso8601? // null)
              else null end) as $epoch |
              {
                deployment: .,
                id: $id,
                is_new: $is_new,
                epoch: $epoch,
                score: (
                  (if $is_new then 100 else 0 end) +
                  (if (.description // "" | contains($description)) and ($description | length > 0) then 80 else 0 end) +
                  (if ($run_id | length > 0) and ((.description // "") | contains($run_id)) then 80 else 0 end) +
                  (if (.title // "") == $title then 70 else 0 end) +
                  (if ($version | length > 0) and ((.title // "") | startswith("chore(release): " + $version)) then 60 else 0 end) +
                  (if ($version | length > 0) and ((.title // "") | contains($version)) then 40 else 0 end) +
                  (if ($epoch != null and $epoch >= $since) then 20 else 0 end)
                )
              }
            ] |
            map(select(.score > 0)) |
            sort_by(.score, .epoch) |
            last // empty |
            .deployment // empty
          '
        }

        wait_for_deployment() {
          local before_ids="$1"
          local since="$2"
          local deadline=$((since + POLL_TIMEOUT_MINUTES * 60))

          while true; do
            local now
            now=$(date +%s)
            if [ "$now" -ge "$deadline" ]; then
              echo "Dokploy deployment timed out after ${POLL_TIMEOUT_MINUTES} minutes."
              exit 1
            fi

            local response
            if ! response=$(fetch_deployments); then
              echo "Failed to fetch Dokploy deployment status. Retrying in ${POLL_INTERVAL_SECONDS}s..."
              sleep "$POLL_INTERVAL_SECONDS"
              continue
            fi

            local deployment
            deployment=$(find_deployment "$response" "$before_ids" "$DEPLOY_TITLE" "$DEPLOY_DESCRIPTION" "$since" || true)

            if [ -z "$deployment" ] || [ "$deployment" = "null" ]; then
              echo "Waiting for Dokploy deployment (title: ${DEPLOY_TITLE})..."
              echo "Known deployments:"
              echo "$response" | normalize_deployments | jq -r '.[] | "- \(.deploymentId // .id // "unknown"): \(.status // "unknown") | \(.title // "" | split("\n")[0])"' | head -5
              sleep "$POLL_INTERVAL_SECONDS"
              continue
            fi

            local status deployment_id
            status=$(echo "$deployment" | jq -r '.status // empty')
            deployment_id=$(echo "$deployment" | jq -r '.deploymentId // .id // empty')

            echo "Deployment ${deployment_id:-unknown} status: ${status:-unknown}"

            case "$status" in
              done)
                echo "Dokploy deployment completed successfully."
                return 0
                ;;
              error)
                echo "Dokploy deployment failed (deploymentId: ${deployment_id:-unknown})."
                exit 1
                ;;
              pending|running|"")
                sleep "$POLL_INTERVAL_SECONDS"
                ;;
              *)
                echo "Unknown Dokploy deployment status: ${status}"
                sleep "$POLL_INTERVAL_SECONDS"
                ;;
            esac
          done
        }

        since_epoch=$(( $(date +%s) - 300 ))
        before_response=$(fetch_deployments)
        before_ids=$(echo "$before_response" | normalize_deployments | jq -r '(.[] | .deploymentId // .id // empty)' | sort -u)

        trigger_deployment

        if [ "$WAIT_FOR_COMPLETION" = "true" ]; then
          wait_for_deployment "$before_ids" "$since_epoch"
        fi
