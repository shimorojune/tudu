<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Tudu Quick Add</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=AR+One+Sans:ital,wght@0,400..700;1,400..700&family=Adamina&family=Fragment+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("tudu.theme") || "system";
          var dark =
            stored === "dark" ||
            (stored === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) {
            document.documentElement.classList.add("dark");
          }
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
    <style>
      html,
      body,
      #root {
        background: transparent !important;
      }

      @keyframes quick-add-enter {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes quick-add-exit {
        from {
          opacity: 1;
          transform: translateY(0);
        }
        to {
          opacity: 0;
          transform: translateY(8px);
        }
      }

      .quick-add-panel-enter {
        animation: quick-add-enter 240ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      .quick-add-panel-exit {
        animation: quick-add-exit 200ms cubic-bezier(0.4, 0, 0.2, 1) both;
      }

      @media (prefers-reduced-motion: reduce) {
        .quick-add-panel-enter,
        .quick-add-panel-exit {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/quickAdd.tsx"></script>
  </body>
</html>
