[package]
name = "tudu"
version = "0.1.1"
description = "Tudu desktop app shell"
authors = ["you"]
edition = "2021"
default-run = "Tudu"
autobins = false

[[bin]]
name = "Tudu"
path = "src/main.rs"

[lib]
name = "tudu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
