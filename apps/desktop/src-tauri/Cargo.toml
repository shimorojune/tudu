[package]
name = "tudu-desktop"
version = "0.0.0"
description = "Tudu for macOS"
edition = "2021"
publish = false
default-run = "tudu"

[[bin]]
name = "tudu"
path = "src/main.rs"

[lib]
name = "tudu_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# The test track's control channel (Tudu Test only). Tudu and Tudu Staging are built without it.
control = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSDockTile", "NSPanel", "NSWindow", "NSResponder", "NSScreen", "NSEvent", "NSGraphics"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSGeometry", "NSProcessInfo", "NSAppleEventManager", "NSAppleEventDescriptor", "NSError"] }
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKWebViewConfiguration", "WKPreferences"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
