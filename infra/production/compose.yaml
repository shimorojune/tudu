# Production, as deployed by Dokploy (project Tudu, environment production, service tudu-production-app), with the
# domains tudu.ezdev.net (web) and api.tudu.ezdev.net (api). The Production: release workflow builds the images on the
# Dokploy host (no registry) and deploys this file (.github/workflows/release.yml). Secret values live in Dokploy's env.
services:
  api:
    image: tudu-api:production
    pull_policy: never
    environment:
      NODE_ENV: production
      PORT: '3456'
      DATABASE_URL: ${DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      BASE_URL: https://api.tudu.ezdev.net
      CORS_ORIGINS: https://tudu.ezdev.net
      EMAIL_TRANSPORT: resend
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: Tudu <sign-in@mail.tudu.ezdev.net>
      # Send feedback mails each report here (set in Dokploy's environment); empty saves reports without mail.
      FEEDBACK_TO: ${FEEDBACK_TO:-}
      # Each report also becomes a public issue with this fine-grained token; empty means email only.
      FEEDBACK_GITHUB_TOKEN: ${FEEDBACK_GITHUB_TOKEN:-}
      FEEDBACK_GITHUB_REPO: ${FEEDBACK_GITHUB_REPO:-shimorojune/tudu}
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://tudu-production-minio:9000
      S3_BUCKET: tudu
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      # Tudu updates itself from the latest GitHub release.
      UPDATES_TRACK: production
      UPDATES_GITHUB_TOKEN: ${UPDATES_GITHUB_TOKEN}
    networks:
      - dokploy-network
    restart: unless-stopped
  web:
    image: tudu-web:production
    pull_policy: never
    networks:
      - dokploy-network
    restart: unless-stopped
networks:
  dokploy-network:
    external: true
