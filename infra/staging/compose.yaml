# Staging, as deployed by Dokploy (project Tudu, environment staging, service tudu-staging-app).
# Images are built on the Dokploy host by the CI runner (.github/workflows/deploy-staging.yml) and used
# straight from the host's image store: no registry, no pull.
services:
  api:
    image: tudu-api:staging
    pull_policy: never
    environment:
      NODE_ENV: production
      PORT: '3456'
      DATABASE_URL: ${DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      BASE_URL: https://api.staging.tudu.ezdev.net
      # The MCP server below (AI access): OAuth tokens are issued for it alone, and Settings shows it.
      MCP_URL: https://mcp.staging.tudu.ezdev.net/mcp
      # The macOS app opens the web site in its windows, so the web's origin is the only one.
      CORS_ORIGINS: https://staging.tudu.ezdev.net
      EMAIL_TRANSPORT: resend
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: Tudu <sign-in@mail.tudu.ezdev.net>
      # Send feedback mails each report here (set in Dokploy's environment); empty saves reports without mail.
      FEEDBACK_TO: ${FEEDBACK_TO:-}
      # Each report also becomes a public issue with this fine-grained token; empty means email only.
      FEEDBACK_GITHUB_TOKEN: ${FEEDBACK_GITHUB_TOKEN:-}
      FEEDBACK_GITHUB_REPO: ${FEEDBACK_GITHUB_REPO:-shimorojune/tudu}
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://tudu-staging-minio:9000
      S3_BUCKET: tudu-staging
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      # The fake Jira at https://api.staging.tudu.ezdev.net/demo-jira (tokens good-…), for review without a real one.
      DEMO_JIRA: '1'
      # Tudu Staging updates itself from the rolling `staging` pre-release (.github/workflows/desktop-staging.yml).
      # The token reads the private repository's releases (fine-grained, Contents: read on shimorojune/tudu).
      UPDATES_TRACK: staging
      UPDATES_GITHUB_TOKEN: ${UPDATES_GITHUB_TOKEN}
    networks:
      - dokploy-network
    restart: unless-stopped
  web:
    image: tudu-web:staging
    pull_policy: never
    networks:
      - dokploy-network
    restart: unless-stopped
  # Tudu's MCP server (apps/mcp), at https://mcp.staging.tudu.ezdev.net. It keeps no data and calls the API by its public
  # address with each caller's own key or app token.
  mcp:
    image: tudu-mcp:staging
    pull_policy: never
    environment:
      TUDU_API_URL: https://api.staging.tudu.ezdev.net
      TUDU_ISSUER: https://api.staging.tudu.ezdev.net/api/auth
      MCP_URL: https://mcp.staging.tudu.ezdev.net/mcp
      TUDU_TIME_ZONE: ${TUDU_TIME_ZONE:-Asia/Kolkata}
    networks:
      - dokploy-network
    restart: unless-stopped
networks:
  dokploy-network:
    external: true
