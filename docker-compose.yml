services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    expose:
      - "3456"
    environment:
      PORT: "3456"
      DATABASE_URL: ${DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      UPDATES_GITHUB_TOKEN: ${UPDATES_GITHUB_TOKEN}
      UPDATES_GITHUB_REPO: ${UPDATES_GITHUB_REPO}
      UPDATES_PUBLIC_BASE_URL: ${UPDATES_PUBLIC_BASE_URL}
      JIRA_TOKEN_ENCRYPTION_KEY: ${JIRA_TOKEN_ENCRYPTION_KEY}
      ATTACHMENT_STORAGE: ${ATTACHMENT_STORAGE}
      ATTACHMENT_FS_ROOT: ${ATTACHMENT_FS_ROOT}
      ATTACHMENT_MAX_BYTES: ${ATTACHMENT_MAX_BYTES}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_POSTHOG_KEY: ${VITE_POSTHOG_KEY}
        VITE_POSTHOG_HOST: ${VITE_POSTHOG_HOST}
    expose:
      - "80"
    depends_on:
      - server
    restart: unless-stopped
