# Local development: Postgres and object storage. `docker compose up -d`, then `pnpm dev`.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: tudu
      POSTGRES_PASSWORD: tudu
      POSTGRES_DB: tudu_dev
    ports:
      - '54320:5432'
    volumes:
      - pg-data:/var/lib/postgresql
  storage:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_ACCESS_KEY: tudu
      RUSTFS_SECRET_KEY: tudu-local-storage
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - storage-data:/data
volumes:
  pg-data:
  storage-data:
