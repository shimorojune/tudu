<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notebook in the browser, floating over the page</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/tudupaper/tokens.css">
<link rel="stylesheet" href="ds/tudupaper/components/bundle.css">
<script src="ds/tudupaper/components/bundle.js"></script>
<link rel="stylesheet" href="kit/scratchpad.css">
<script src="kit/scratchpad.js"></script>
<script src="kit/scratchpad-data.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<x-import component-from-global-scope="TuduPaper.Desk" theme="light" gutter="{{ no }}">
<style>
.pw :is(x-import, sc-if) { display: contents; }
.pw-tb { padding: 0 32px 0 8px; }
.pw-tb .tp-ib.pw-on { background: var(--accent); color: var(--foreground); }
.pw-win { position: absolute; z-index: 5; transition: opacity 220ms var(--ease-arrive), transform 220ms var(--ease-arrive); }
/* Opening fades up with a hair of scale (220ms, arrive); closing sinks back the same way, a touch quicker (180ms, leave). */
.pw-win.pw-gone { opacity: 0; transform: scale(.97) translateY(6px); pointer-events: none; transition: opacity 180ms var(--ease-leave), transform 180ms var(--ease-leave); }
.pw-win.pw-arrive { animation: pw-in 220ms var(--ease-arrive) both; }
@keyframes pw-in { from { opacity: 0; transform: scale(.97) translateY(6px); } }
@media (prefers-reduced-motion: reduce) { .pw-win, .pw-win.pw-gone, .pw-win.pw-arrive { transition-duration: 1ms; animation-duration: 1ms; } }
</style>
<div class="pw" style="position: relative; height: 100%; display: flex; align-items: stretch; background: var(--background); color: var(--foreground); font-family: var(--font-sans); overflow: hidden;">
<div style="flex: 0 0 auto; min-width: 0; height: 100%;">
<x-import component-from-global-scope="TuduPaper.Sidebar" head="{{ shHead }}" items="{{ nav }}" week="{{ week }}" spaces="{{ none }}" connected="{{ none }}" active="today"></x-import>
</div>
<main style="flex: 1 1 560px; min-width: 0; height: 100%; display: flex; flex-direction: column;">
<header class="tp-root tp-topbar pw-tb"><span class="tp-tb-sp"></span><x-import component-from-global-scope="TuduPaper.IconButton" label="Report a bug or idea" tip-side="bottom" class-name="tp-tb-bug"><x-import component-from-global-scope="TuduPaper.Icon" name="bug" size="{{ 17 }}"></x-import></x-import><x-import component-from-global-scope="TuduPaper.IconButton" label="Search tasks and notes" tip-side="bottom"><x-import component-from-global-scope="TuduPaper.Icon" name="search" size="{{ 17 }}"></x-import></x-import><x-import component-from-global-scope="TuduPaper.IconButton" label="Notebook" tip-side="bottom" class-name="{{ padCls }}" on-click="{{ toggle }}"><x-import component-from-global-scope="TuduPaper.PadIcon" name="pad" size="{{ 17 }}"></x-import></x-import><x-import component-from-global-scope="TuduPaper.IconButton" label="Inbox" tip-side="bottom"><x-import component-from-global-scope="TuduPaper.Icon" name="inbox" size="{{ 17 }}"></x-import></x-import><x-import component-from-global-scope="TuduPaper.Button" variant="primary" icon="{{ plus }}">New task</x-import><x-import component-from-global-scope="TuduPaper.Avatar" initials="RR" name="Rohit Raj"></x-import></header>
<div class="tp-scroll" style="flex: 1; min-height: 0; padding: 8px 20px 20px 8px; box-sizing: border-box;">
<x-import component-from-global-scope="TuduPaper.Sheet" label="Today" fill="{{ yes }}" min-height="{{ 560 }}">
<x-import component-from-global-scope="TuduPaper.DayHeader" eyebrow="Today · Week 43" day="Sunday" date="25 October" done="{{ 1 }}" total="{{ 4 }}" is-today="{{ yes }}"></x-import>
<x-import component-from-global-scope="TuduPaper.SheetBody"><x-import component-from-global-scope="TuduPaper.TaskList" tasks="{{ today }}"></x-import></x-import>
</x-import>
</div>
</main>
<div class="{{ winClass }}" style="{{ winStyle }}">
<x-import component-from-global-scope="TuduPaper.PadWindow" notebook="{{ nb }}" variant="web" recent="{{ recent }}" tasks="{{ tasks }}" no-focus="{{ yes }}" on-close="{{ close }}" on-open-app="{{ popout }}" on-drag-start="{{ dragStart }}"></x-import>
</div>
</div>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
// In the browser the note button in the top bar toggles the panel (keyboard shortcuts come later). It floats over the page and drags anywhere inside it; it keeps its size
// (browsers can't pin above other apps, so no pin or fill-the-screen here). The ↗ button opens the note in its own popup
// window (see the next board). Working: toggle from the top bar, drag by the bar, close.
var STAGE = { w: 1440, h: 900, top: 64 };
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { x: 760, y: 120, open: true, n: 0 }; }
  renderVals() {
    var s = this.state, self = this, R = window.React, TP = window.TuduPaper, D = window.PadDemo;
    function track(e) {
      if (e.button !== undefined && e.button !== 0) return;
      if (e.target.closest && e.target.closest('button')) return;
      e.preventDefault();
      var sx = e.clientX, sy = e.clientY, o = { x: s.x, y: s.y };
      var el = e.currentTarget, scale = el.getBoundingClientRect().width / el.offsetWidth || 1;
      function mv(ev) { self.setState({ x: Math.max(0, Math.min(STAGE.w - 600, o.x + (ev.clientX - sx) / scale)), y: Math.max(STAGE.top, Math.min(STAGE.h - 460, o.y + (ev.clientY - sy) / scale)) }); }
      function up() { document.removeEventListener('pointermove', mv); document.removeEventListener('pointerup', up); }
      document.addEventListener('pointermove', mv); document.addEventListener('pointerup', up);
    }
    return { yes: true, no: false, none: [], plus: R.createElement(TP.Icon, { name: 'plus', size: 15 }),
      shHead: R.createElement(TP.SpaceSwitch, { spaces: D.SPACES, active: 'nw' }), nav: D.nav, week: D.week,
      today: [{ id: 'NW-38', title: 'Write up what we learned from the onboarding interviews' }, { id: 'NW-41', title: 'Sync with Meera on onboarding copy' }, { id: 'NW-65', title: 'Plan the team offsite agenda' }, { id: 'ME-58', title: 'Pay the electricity bill', defaultDone: true }],
      recent: D.RECENT, nb: D.NOTEBOOK, tasks: D.TASKS,
      padCls: s.open ? 'pw-on' : '',
      winClass: 'pw-win' + (s.open ? '' : ' pw-gone') + '',
      winStyle: 'left: ' + s.x + 'px; top: ' + s.y + 'px; width: 600px; height: 460px;',
      toggle: function () { self.setState({ open: !s.open, n: s.open ? s.n : s.n + 1 }); },
      close: function () { self.setState({ open: false }); },
      popout: function () { TP.showToast('Opens this note in a popup window of its own.'); },
      dragStart: track
    };
  }
}
</script>
</body>
</html>
