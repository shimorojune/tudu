<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Search finds notes too</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/tudupaper/tokens.css">
<link rel="stylesheet" href="ds/tudupaper/components/bundle.css">
<script src="ds/tudupaper/components/bundle.js"></script>
<link rel="stylesheet" href="kit/scratchpad.css">
<script src="kit/scratchpad.js"></script>
<script src="kit/scratchpad-data.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<x-import component-from-global-scope="TuduPaper.Desk" theme="light" gutter="{{ no }}">
<style>
.ps :is(x-import, sc-if) { display: contents; }
.ps-tb { padding: 0 32px 0 8px; }
.ps-veil { position: absolute; inset: 0; background: var(--veil); }
.ps-panel { position: absolute; left: 50%; top: 96px; width: 640px; transform: translateX(-50%); }
</style>
<div class="ps" style="position: relative; height: 100%; display: flex; align-items: stretch; background: var(--background); color: var(--foreground); font-family: var(--font-sans);">
<div style="flex: 0 0 auto; min-width: 0; height: 100%;">
<x-import component-from-global-scope="TuduPaper.Sidebar" head="{{ shHead }}" items="{{ nav }}" week="{{ week }}" spaces="{{ none }}" connected="{{ none }}" active="today"></x-import>
</div>
<main style="flex: 1 1 560px; min-width: 0; height: 100%; display: flex; flex-direction: column;">
<header class="tp-root tp-topbar ps-tb"><span class="tp-tb-sp"></span><x-import component-from-global-scope="TuduPaper.IconButton" label="Report a bug or idea" tip-side="bottom" class-name="tp-tb-bug"><x-import component-from-global-scope="TuduPaper.Icon" name="bug" size="{{ 17 }}"></x-import></x-import><x-import component-from-global-scope="TuduPaper.IconButton" label="Search tasks and notes" tip-side="bottom" class-name="tp-on"><x-import component-from-global-scope="TuduPaper.Icon" name="search" size="{{ 17 }}"></x-import></x-import><x-import component-from-global-scope="TuduPaper.IconButton" label="Notebook" tip-side="bottom"><x-import component-from-global-scope="TuduPaper.PadIcon" name="pad" size="{{ 17 }}"></x-import></x-import><x-import component-from-global-scope="TuduPaper.IconButton" label="Inbox" tip-side="bottom"><x-import component-from-global-scope="TuduPaper.Icon" name="inbox" size="{{ 17 }}"></x-import></x-import><x-import component-from-global-scope="TuduPaper.Button" variant="primary" icon="{{ plus }}">New task</x-import><x-import component-from-global-scope="TuduPaper.Avatar" initials="RR" name="Rohit Raj"></x-import></header>
<div class="tp-scroll" style="flex: 1; min-height: 0; padding: 8px 20px 20px 8px; box-sizing: border-box;">
<x-import component-from-global-scope="TuduPaper.Sheet" label="Today" fill="{{ yes }}" min-height="{{ 560 }}">
<x-import component-from-global-scope="TuduPaper.DayHeader" eyebrow="Today · Week 43" day="Sunday" date="25 October" done="{{ 1 }}" total="{{ 4 }}" is-today="{{ yes }}"></x-import>
<x-import component-from-global-scope="TuduPaper.SheetBody"><x-import component-from-global-scope="TuduPaper.TaskList" tasks="{{ today }}"></x-import></x-import>
</x-import>
</div>
</main>
<div class="ps-veil" aria-hidden="true"></div>
<div class="ps-panel"><x-import component-from-global-scope="TuduPaper.SearchPanelPads" layer="none" items="{{ items }}" pads="{{ pads }}" initial="{{ init }}" placeholder="Search tasks and notes" hint="Search your tasks and notes by title, task ID, Jira key or the words inside." on-pick="{{ pickTask }}" on-pick-pad="{{ pickPad }}"></x-import></div>
</div>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
// One Search for everything that's yours. Notes come under their own heading after the tasks, matched on their title and
// the words inside. Picking a note opens it in the note window, over whatever you were on. Try “onboarding”, “offsite”, “spam” or “teapot”.
class Component extends DCLogic {
  renderVals() {
    var R = window.React, TP = window.TuduPaper, D = window.PadDemo;
    var pads = Object.keys(D.PADS).map(function (k) { return D.PADS[k]; });
    return { yes: true, no: false, none: [], plus: R.createElement(TP.Icon, { name: 'plus', size: 15 }),
      shHead: R.createElement(TP.SpaceSwitch, { spaces: D.SPACES, active: 'nw' }), nav: D.nav, week: D.week,
      today: [{ id: 'NW-38', title: 'Write up what we learned from the onboarding interviews' }, { id: 'NW-41', title: 'Sync with Meera on onboarding copy' }, { id: 'NW-65', title: 'Plan the team offsite agenda' }, { id: 'ME-58', title: 'Pay the electricity bill', defaultDone: true }],
      items: [
        { key: 'NW-38', id: 'NW-38', title: 'Write up what we learned from the onboarding interviews', where: { label: 'Today', tone: 'today' } },
        { key: 'NW-41', id: 'NW-41', title: 'Sync with Meera on onboarding copy', where: { label: 'Today', tone: 'today' } },
        { key: 'NW-65', id: 'NW-65', title: 'Plan the team offsite agenda', where: { label: 'Today', tone: 'today' }, notes: 'Venue, travel, the agenda draft' },
        { key: 'PF-12', id: 'PF-12', title: 'Check the staging backup restore', where: { label: 'Backlog' } },
        { key: 'ME-62', id: 'ME-62', title: 'Call the bank about the card', where: { label: 'Mon 26' } }
      ],
      pads: pads, init: { query: 'onboarding', noFocus: true },
      pickTask: function (t) { TP.showToast('Opens ' + t.id + '.'); },
      pickPad: function (p) { TP.showToast('Opens “' + (p.title || p.first) + '” in the note window, over this page.'); }
    };
  }
}
</script>
</body>
</html>
