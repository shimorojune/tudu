<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Task panel with your notes</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/tudupaper/tokens.css">
<link rel="stylesheet" href="ds/tudupaper/components/bundle.css">
<script src="ds/tudupaper/components/bundle.js"></script>
<link rel="stylesheet" href="kit/scratchpad.css">
<script src="kit/scratchpad.js"></script>
<script src="kit/scratchpad-data.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<x-import component-from-global-scope="TuduPaper.Desk" theme="light" gutter="{{ no }}">
<style>
.pt :is(x-import, sc-if) { display: contents; }
.pt-tb { padding: 0 32px 0 8px; }
.pt-win { position: absolute; z-index: 1000; width: 640px; height: 460px; animation: pt-in 220ms var(--ease-arrive) both; }
@keyframes pt-in { from { opacity: 0; transform: scale(.97) translateY(6px); } }
.pt-win.pt-out { animation: pt-out 180ms var(--ease-leave) forwards; pointer-events: none; }
@keyframes pt-out { to { opacity: 0; transform: scale(.97) translateY(6px); } }
@media (prefers-reduced-motion: reduce) { .pt-win, .pt-win.pt-out { animation-duration: 1ms; } }
</style>
<div class="pt" style="height: 100%; display: flex; align-items: stretch; background: var(--background); color: var(--foreground); font-family: var(--font-sans);">
<div style="flex: 0 0 auto; min-width: 0; height: 100%;">
<x-import component-from-global-scope="TuduPaper.Sidebar" head="{{ shHead }}" items="{{ nav }}" week="{{ week }}" spaces="{{ none }}" connected="{{ none }}" active="today"></x-import>
</div>
<main style="flex: 1 1 560px; min-width: 0; height: 100%; display: flex; flex-direction: column;">
<header class="tp-root tp-topbar pt-tb"><span class="tp-tb-sp"></span><x-import component-from-global-scope="TuduPaper.IconButton" label="Report a bug or idea" tip-side="bottom" class-name="tp-tb-bug"><x-import component-from-global-scope="TuduPaper.Icon" name="bug" size="{{ 17 }}"></x-import></x-import><x-import component-from-global-scope="TuduPaper.IconButton" label="Search tasks and notes" tip-side="bottom"><x-import component-from-global-scope="TuduPaper.Icon" name="search" size="{{ 17 }}"></x-import></x-import><x-import component-from-global-scope="TuduPaper.IconButton" label="Notebook" tip-side="bottom"><x-import component-from-global-scope="TuduPaper.PadIcon" name="pad" size="{{ 17 }}"></x-import></x-import><x-import component-from-global-scope="TuduPaper.IconButton" label="Inbox" tip-side="bottom"><x-import component-from-global-scope="TuduPaper.Icon" name="inbox" size="{{ 17 }}"></x-import></x-import><x-import component-from-global-scope="TuduPaper.Button" variant="primary" icon="{{ plus }}">New task</x-import><x-import component-from-global-scope="TuduPaper.Avatar" initials="RR" name="Rohit Raj"></x-import></header>
<div class="tp-scroll" style="flex: 1; min-height: 0; padding: 8px 20px 20px 8px; box-sizing: border-box;">
<x-import component-from-global-scope="TuduPaper.Sheet" label="Today" fill="{{ yes }}" min-height="{{ 560 }}">
<x-import component-from-global-scope="TuduPaper.DayHeader" eyebrow="Today · Week 43" day="Sunday" date="25 October" done="{{ 1 }}" total="{{ 5 }}" is-today="{{ yes }}"></x-import>
<x-import component-from-global-scope="TuduPaper.SheetBody"><x-import component-from-global-scope="TuduPaper.TaskList" tasks="{{ tasks }}" add-label="Write the next thing…" on-open-task="{{ openTask }}" selected-key="NW-38"></x-import></x-import>
</x-import>
</div>
</main>
</div>
<x-import component-from-global-scope="TuduPaper.Drawer" open="{{ yes }}" label="Task details" modal="{{ no }}" on-close="{{ noop }}">
<x-import component-from-global-scope="TuduPaper.TaskDetailPads" task="{{ task }}" me="{{ me }}" projects="{{ projects }}" calendar="{{ cal }}" jira="{{ no }}" pad-links="{{ padLinks }}"></x-import>
</x-import>
<sc-if value="{{ win }}"><div class="{{ winCls }}" style="{{ winStyle }}"><x-import component-from-global-scope="TuduPaper.PadWindow" recent="{{ recent }}" notebook="{{ nb }}" tasks="{{ allTasks }}" new-linked="{{ linkedTo }}" active="{{ winActive }}" open-count="{{ openCount }}" on-close="{{ closeWin }}" on-open-app="{{ closeWin }}" on-drag-start="{{ dragStart }}"></x-import></div></sc-if>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
// New note opens the note window on a blank note, already linked to this task, ready to type. The task panel gains a notebook section under Notes: your notes linked to this task. Only you see them, even on a shared
// task. Working: click a note (opens in the note window, over the task), New note (linked at once, opens in the window), Link a note, Unlink.
var ON = { name: 'Onboarding', color: '#4e7a6b' };
class Component extends DCLogic {
  constructor(props) { super(props); var D = window.PadDemo; this.state = { pads: [D.PADS.interviews], win: false, n: 0, x: 150, y: 170 }; }
  renderVals() {
    var R = window.React, TP = window.TuduPaper, D = window.PadDemo, self = this;
    var mine = this.state.pads;
    var all = D.ALLPADS.map(function (x) { return Object.assign({}, x, { linked: mine.some(function (m) { return m.id === x.key; }) }); });
    return { yes: true, no: false, none: [], noop: function () {}, plus: R.createElement(TP.Icon, { name: 'plus', size: 15 }),
      shHead: R.createElement(TP.SpaceSwitch, { spaces: D.SPACES, active: 'nw' }), nav: D.nav, week: D.week,
      me: { id: 'u0', name: 'Rohit Raj', initials: 'RR', color: '#a0613d' }, projects: [ON], cal: { month: '2026-10', today: '2026-10-25' },
      tasks: [
        { id: 'NW-38', title: 'Write up what we learned from the onboarding interviews', project: ON, comments: 2 },
        { id: 'NW-41', title: 'Sync with Meera on onboarding copy', project: ON },
        { id: 'NW-65', title: 'Plan the team offsite agenda', comments: 2 },
        { id: 'NW-70', title: 'Review the invite email copy', defaultDone: true },
        { id: 'NW-72', title: 'Book the offsite venue' }
      ],
      win: this.state.win, winActive: this.state.active || 'new', openCount: this.state.n, winCls: 'pt-win' + (this.state.out ? ' pt-out' : ''), winStyle: 'left: ' + this.state.x + 'px; top: ' + this.state.y + 'px;',
      recent: D.RECENT, nb: D.NOTEBOOK, allTasks: D.TASKS, linkedTo: [D.T.nw38],
      closeWin: function () { if (self.state.out) return; self.setState({ out: true }); setTimeout(function () { self.setState({ win: false, out: false }); }, 180); },
      dragStart: function (e) {
        if (e.button !== undefined && e.button !== 0) return;
        if (e.target.closest && e.target.closest('button')) return;
        e.preventDefault();
        var sx = e.clientX, sy = e.clientY, o = { x: self.state.x, y: self.state.y };
        var el = e.currentTarget, scale = el.getBoundingClientRect().width / el.offsetWidth || 1;
        function mv(ev) { self.setState({ x: Math.max(0, Math.min(1440 - 640, o.x + (ev.clientX - sx) / scale)), y: Math.max(0, Math.min(900 - 460, o.y + (ev.clientY - sy) / scale)) }); }
        function up() { document.removeEventListener('pointermove', mv); document.removeEventListener('pointerup', up); }
        document.addEventListener('pointermove', mv); document.addEventListener('pointerup', up);
      },
      task: { id: 'NW-38', title: 'Write up what we learned from the onboarding interviews', project: ON, notes: '<p>Share with the Northwind team before planning. Keep it to one page.</p>', comments: [] },
      openTask: function () {},
      padLinks: { pads: mine, all: all,
        onOpen: function (p) { self.setState({ win: true, out: false, active: p.id && D.PADS[p.id] ? p.id : 'new', n: self.state.n + 1 }); },
        onNew: function () { var n = { id: 'n' + Date.now(), title: '', first: 'New note', where: 'Not in a folder', edited: 'now', links: 1 }; self.setState({ pads: mine.concat([n]), win: true, out: false, active: 'new', n: self.state.n + 1 }); },
        onLink: function (x) { if (mine.some(function (m) { return m.id === x.key; })) return; var p = D.PADS[x.key]; self.setState({ pads: mine.concat([Object.assign({}, p, { links: (p.links || 0) + 1 })]) }); },
        onUnlink: function (p) { self.setState({ pads: mine.filter(function (m) { return m.id !== p.id; }) }); TP.showToast('Unlinked. The note is still in your Notebook.', { action: 'Undo' }); }
      }
    };
  }
}
</script>
</body>
</html>
