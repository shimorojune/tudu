<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notebook, phone</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/tudupaper/tokens.css">
<link rel="stylesheet" href="ds/tudupaper/components/bundle.css">
<script src="ds/tudupaper/components/bundle.js"></script>
<link rel="stylesheet" href="kit/scratchpad.css">
<script src="kit/scratchpad.js"></script>
<script src="kit/scratchpad-data.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<x-import component-from-global-scope="TuduPaper.Desk" theme="light" gutter="{{ no }}">
<style>
.ph :is(x-import, sc-if) { display: contents; }
.ph-top { flex: none; display: flex; align-items: center; height: 54px; padding: 0 8px; }
.ph-back { display: inline-flex; align-items: center; gap: 2px; height: 44px; padding: 0 10px 0 4px; border: 0; border-radius: var(--radius-md); background: transparent; color: var(--foreground-2); font: inherit; font-size: 15px; cursor: pointer; }
.ph-back:active { background: var(--accent); }
.ph-page { flex: 1; min-height: 0; padding: 0 10px 10px; display: flex; flex-direction: column; }
.ph-sheet { flex: 1; min-height: 0; overflow: hidden; }
.ph-turn-in { height: 100%; animation: ph-in var(--dur-day-turn) var(--ease-arrive) both; }
.ph-turn-back { height: 100%; animation: ph-back var(--dur-day-turn) var(--ease-arrive) both; }
@keyframes ph-in { from { opacity: 0; transform: translateX(14px); } }
@keyframes ph-back { from { opacity: 0; transform: translateX(-14px); } }
.ph .tp-pd-tree-h h2 { font-size: 30px; }
.ph .tp-pd-row.tp-root, .ph .tp-pd-ftog { min-height: 44px; font-size: 15px; }
.ph .tp-pd-fadd { display: none; }
.ph .tp-pd-frow .tp-pd-fcount { opacity: 1; }
.ph .tp-pd-ed.tp-compact .tp-pd-ed-in { padding: 6px 18px 18px; }
@media (prefers-reduced-motion: reduce) { .ph-turn-in, .ph-turn-back { animation-duration: 1ms; } }
</style>
<div class="ph" style="position: relative; width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; background: var(--background); color: var(--foreground); font-family: var(--font-sans);">
<div class="ph-top">
<sc-if value="{{ inList }}" hint-placeholder-val="{{ true }}"><button type="button" class="ph-back" onClick="{{ toMore }}"><x-import component-from-global-scope="TuduPaper.Icon" name="left" size="{{ 20 }}"></x-import><span>More</span></button></sc-if>
<sc-if value="{{ inPad }}" hint-placeholder-val="{{ false }}"><button type="button" class="ph-back" onClick="{{ toList }}"><x-import component-from-global-scope="TuduPaper.Icon" name="left" size="{{ 20 }}"></x-import><span>Notebook</span></button></sc-if>
</div>
<div class="ph-page"><div class="tp-sheet ph-sheet">
<sc-if value="{{ inList }}" hint-placeholder-val="{{ true }}"><div class="{{ turnCls }}"><x-import component-from-global-scope="TuduPaper.PadTree" folders="{{ folders }}" pads="{{ loose }}" default-open="{{ openIds }}" trash-count="{{ 3 }}" on-pick="{{ pick }}" on-new-pad="{{ newPad }}" on-new-folder="{{ newFolder }}" on-trash="{{ noop }}"></x-import></div></sc-if>
<sc-if value="{{ inPad }}" hint-placeholder-val="{{ false }}"><div class="{{ turnCls }}"><x-import component-from-global-scope="TuduPaper.PadEditor" pad="{{ pad }}" compact="{{ yes }}" save="{{ save }}" tasks="{{ tasks }}" on-edit="{{ edited }}"></x-import></div></sc-if>
</div></div>
</div>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
// On a phone the Notebook lives under More (there is no room for a fourth header button, and no shortcut to summon it).
// Tap a note: it turns in like a page; ‹ Notebook turns back. Notes linked to a task also show in the task's page.
// No floating window or pop-out on phones. Working: open folders, open a note, type (a tick when it saves), back.
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { open: null, dir: 'in', save: 'saved' }; }
  renderVals() {
    var s = this.state, self = this, D = window.PadDemo, TP = window.TuduPaper;
    return { yes: true, noop: function () {}, inList: !s.open, inPad: !!s.open, turnCls: s.dir === 'in' ? 'ph-turn-in' : 'ph-turn-back',
      folders: D.FOLDERS, loose: D.LOOSE, openIds: { 'f-nw': true }, pad: s.open ? D.PADS[s.open] : null, save: s.save, tasks: D.TASKS,
      pick: function (p) { self.setState({ open: p.id, dir: 'in', save: 'saved' }); },
      toList: function () { self.setState({ open: null, dir: 'back' }); },
      toMore: function () { TP.showToast('Back to More.'); },
      newPad: function () { TP.showToast('A new note opens, ready to type.'); },
      newFolder: function () { TP.showToast('New folder. Name it in place.'); },
      edited: function () { self.setState({ save: 'saving' }); clearTimeout(self._t); self._t = setTimeout(function () { self.setState({ save: 'saved' }); }, 900); }
    };
  }
}
</script>
</body>
</html>
