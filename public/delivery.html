<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Delivery</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }
    .delivery-overlay {
      display: block !important;
      background: transparent;
    }
  </style>
</head>
<body>
  <div class="delivery-overlay" id="deliveryOverlay" aria-hidden="true">
    <div class="courier" id="courier">
      <svg class="bird-svg bird-facing-right" viewBox="0 0 90 60" aria-hidden="true">
        <path class="bird-wing bird-wing-up" d="M42 28 Q62 6 52 30 Q44 32 42 28" />
        <ellipse class="bird-body" cx="38" cy="34" rx="16" ry="12" />
        <circle class="bird-head" cx="52" cy="24" r="9" />
        <circle class="bird-eye" cx="55" cy="22" r="2" />
        <path class="bird-beak" d="M58 24 L68 25 L58 27 Z" />
        <path class="bird-wing bird-wing-down" d="M34 32 Q14 20 24 38 Q32 40 34 32" />
        <path class="bird-tail" d="M24 36 L8 32 L20 42 Z" />
        <line class="envelope-string" x1="60" y1="27" x2="60" y2="42" stroke-width="1.5" />
      </svg>
      <div class="envelope-carry" id="envelopeCarry">
        <div class="env-back"></div>
        <div class="env-letter"></div>
        <div class="env-flap-closed"></div>
      </div>
    </div>
    <div class="envelope-stand hidden" id="envelopeStand">
      <div class="envelope-carry envelope-carry--large" id="envelopeStandBox">
        <div class="env-back"></div>
        <div class="env-letter"></div>
        <div class="env-flap-closed"></div>
      </div>
    </div>
  </div>
  <script src="/delivery.js"></script>
</body>
</html>
